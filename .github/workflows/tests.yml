name: tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            binary: namemcsniper
          - os: windows-latest
            platform: windows-x64
            binary: namemcsniper.exe
          - os: macos-latest
            platform: macos-arm64
            binary: namemcsniper
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
      - run: cargo +stable test --locked --all-targets
      - name: Build release binary
        if: github.event_name == 'push'
        run: cargo +stable build --locked --release
      - name: Package and smoke test the release ZIP
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          ./.github/scripts/package-release.ps1 -Platform '${{ matrix.platform }}' -Binary 'target/release/${{ matrix.binary }}' -OutputDirectory dist
      - name: Upload release ZIP
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: namemcsniper-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
