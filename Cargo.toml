[package]
name = "namemcsniper"
version = "1.0.0-rc.1"
edition = "2024"
description = "Schedule Minecraft Java username changes with an offline preview"
license = "MIT"
repository = "https://github.com/zwroe/NameMCSniper"

[dependencies]
anstream = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1"
httpdate = "1"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
rpassword = "7"
scraper = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt", "signal", "time"] }
uuid = "1"
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
